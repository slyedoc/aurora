[workspace]
members = ["crates/*"]

[package]
name = "bevy_aurora"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# Developer diagnostics: Nsight Aftermath GPU crash dumps (src/aftermath.rs), linked from
# `$AFTERMATH_SDK` (default `~/nvidia/aftermath`) when that lib exists at build time.
dev = []

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[dependencies]
ash = { version = "0.38.0", features = ["linked"] }
ash-window = "0.13.0"
# No default features: this crate is its own renderer, in one world (no render sub-app, no
# pipelined rendering, no bevy_render/bevy_pbr). The material is `material::AuroraMaterial`.
# UI is `bevy_feathers_core`: feathers/bevy_ui/bevy_text WITHOUT `bevy_ui_render`,
# so the bevy_ui node tree is laid out by bevy and rasterized by this crate.
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false, features = [
    # app / platform
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_log",
    "bevy_state",
    "reflect_auto_register",
    "bevy_winit",
    "x11",
    "wayland",
    "custom_cursor",
    "bevy_window",
    "bevy_audio",
    # assets
    "bevy_asset",
    "file_watcher",
    "scene",
    "bevy_image",
    "hdr",
    "png",
    "bevy_mesh",
    "bevy_mikktspace",
    "bevy_camera",
    # ui stack, render-free
    "bevy_text",
    "default_font",
    "bevy_ui",
    "bevy_ui_widgets",
    "bevy_input_focus",
    "bevy_picking",
    "ui_picking",
    "bevy_feathers_core",
    "experimental_bevy_feathers_inspector",
] }
aurora_cluster_mesh = { path = "crates/aurora_cluster_mesh" }
# Pure type definitions (`TextureFormat` for `Image::convert`); the version bevy_image resolves to.
wgpu-types = { version = "30", default-features = false }
bytemuck = { version = "1.14.3", features = ["derive"] }
crossbeam = "0.8.4"
glam = { version = "0.33.0" }
gltf = { version = "1.4.1", features = ["KHR_materials_transmission", "KHR_materials_ior", "KHR_materials_volume", "KHR_materials_emissive_strength", "KHR_texture_transform"] }
gpu-allocator = "0.28.0"
#gpu-allocator = { git = "https://github.com/Traverse-Research/gpu-allocator.git", branch = "main" }
half = "2.4.1"
log = "0.4.20"
png = "0.17.14"
rand = "0.8.5"
rand_chacha = "0.3.1"
raw-window-handle = "0.6.2"
rayon = "1.10.0"
shaderc = "0.8.3"
thiserror = "1.0.57"


# Redirect every bevy_* crate to the fork branch `aurora`: upstream main + render-free feathers
# (`bevy_feathers_core`), the .bsn asset loader and free_camera tweaks.
[patch."https://github.com/bevyengine/bevy"]
bevy = { git = "https://github.com/slyedoc/bevy", branch = "aurora" }
