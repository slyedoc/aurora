# Layered terrain: height layers (imported heightmaps, stamps, sculpt) evaluated by Slang
# kernels into 256² pages; LOD tiles are procedural meshes filled from the pages, and colliders
# are heightfields over them.
[package]
name = "aurora_landscape"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy_aurora = { path = "../.." }
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_image",
    "bevy_camera",
    "bevy_log",
] }
avian3d = { git = "https://github.com/avianphysics/avian", branch = "main", default-features = false, features = [
    "3d",
    "parry-f32",
    "default-collider",
] }
ash = "0.38.0"
bytemuck = { version = "1.14.3", features = ["derive"] }
gpu-allocator = "0.28.0"
log = "0.4.20"
lz4_flex = { version = "0.13", default-features = false, features = ["std", "frame"] }
thiserror = "1.0.57"
wgpu-types = { version = "30", default-features = false }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
